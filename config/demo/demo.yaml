# Self-contained demo of the LLMRouterService prototype: a namespace,
# a placeholder Gateway, one LLMRouterServiceProfile and one
# LLMRouterService. Requires: GAIE + Gateway API CRDs (pre-installed
# in the dev cluster) and the manager running.
#
#   kubectl apply -k config/demo
#
apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-routerservice-demo
---
# A placeholder GatewayClass: no controller implements it in the dev
# cluster, so the Gateway below is never admitted. The operators only
# ever reference the Gateway, never create one; conditions do not
# depend on a live data plane.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: llm-d
spec:
  controllerName: llm-d.ai/placeholder
---
# The placeholder Gateway the demo service attaches to.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference-gateway
  namespace: llm-d-routerservice-demo
spec:
  gatewayClassName: llm-d
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
# The reusable profile: infrastructure defaults only — an EPP replica
# count and a default EndpointPickerConfig. A service referencing this
# profile picks these up underneath its own spec, and pins this
# generation until it explicitly accepts a drift.
apiVersion: llm-d.ai/v1alpha1
kind: LLMRouterServiceProfile
metadata:
  name: vllm-default
  namespace: llm-d-routerservice-demo
spec:
  routing:
    router:
      epp:
        replicas: 1
        endpointPicker:
          plugins:
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: prefix-cache-scorer
          - type: metrics-data-source
            parameters:
              scheme: http
              path: /metrics
              insecureSkipVerify: true
          - type: core-metrics-extractor
          schedulingProfiles:
          - name: default
            plugins:
            - pluginRef: queue-scorer
              weight: 2
            - pluginRef: kv-cache-utilization-scorer
              weight: 2
            - pluginRef: prefix-cache-scorer
              weight: 3
---
# The service: model identity, decode-only workload (the sim stand-in
# image; the controller fills args ["--model", "sim-qwen", "--port",
# "8000"]), and the gateway ref. Everything else — EPP, InferencePool,
# HTTPRoute — is derived.
apiVersion: llm-d.ai/v1alpha1
kind: LLMRouterService
metadata:
  name: sim-qwen
  namespace: llm-d-routerservice-demo
spec:
  model:
    uri: hf://simulated/qwen
    name: sim-qwen
  profileRef: vllm-default
  workload:
    kind: Deployment
    decode:
      replicas: 2
      template:
        containers:
        - name: model-server
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
  routing:
    mode: gateway
    gateway:
      refs:
      - provider: envoy
        name: inference-gateway
